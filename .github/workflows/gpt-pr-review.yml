name: GPT PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write # risk:* 라벨 부착(라벨은 issues API)

jobs:
  review:
    # fork에서 온 PR은 Secrets에 접근할 수 없어 OPENAI_API_KEY가 비어 있음 → 스킵.
    # (본인 레포 브랜치에서 올린 PR만 리뷰)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: GPT review
        run: node .github/scripts/gpt-review.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 본인 계정에서 접근 가능한 모델 ID로 교체하세요 (예: gpt-5, gpt-5-mini 등)
          OPENAI_MODEL: gpt-5.5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
